[package]
name = "libdevice"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Simulated mobile device data (geometry, insets, cutouts, corners) and --device argument parsing"
repository = "https://github.com/tmzt/libdevice"
readme = "README.md"
keywords = ["simulator", "mobile", "insets", "safe-area", "device"]
categories = ["simulation", "command-line-interface"]

[features]
# Small secrets and adapter keys on the desktop, with libmobile's API: the
# macOS login Keychain (`secure_store`, `key_store`). libdevice's first
# platform code; off by default.
secure-store = ["dep:zeroize", "dep:log", "dep:security-framework"]
# `key_store::Vault::memory()`, an in-memory vault for tests only. Normal
# app builds do not have it.
test-vault = ["secure-store"]
# `link::open_link`: open an http or https link in the default browser, with
# libmobile's API. macOS through NSWorkspace; other desktops are unsupported.
open-link = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]

[dependencies]
zeroize = { version = "1.8", features = ["derive"], optional = true }
log = { version = "0.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }
# The same versions as libmorph's, so an app builds one copy.
objc2 = { version = "0.5.2", optional = true }
objc2-foundation = { version = "0.2.2", features = ["NSString", "NSURL"], optional = true }
objc2-app-kit = { version = "0.2.2", features = ["NSWorkspace"], optional = true }

[build-dependencies]
toml = { version = "1.1.8", default-features = false, features = ["parse", "preserve_order", "serde"] }

[[example]]
name = "securestore"
required-features = ["secure-store"]

[[example]]
name = "open_link"
required-features = ["open-link"]
