[package]
name = "libdevice"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Simulated mobile display geometry, with optional deterministic offscreen wgpu device setup"
repository = "https://github.com/tmzt/libdevice"
readme = "README.md"
keywords = ["wgpu", "gpu", "simulator", "offscreen", "headless"]
categories = ["graphics", "rendering"]

[features]
default = []
wgpu = ["dep:wgpu"]

[dependencies]
wgpu = { version = "30.0.1", optional = true }

[package.metadata.docs.rs]
all-features = true
